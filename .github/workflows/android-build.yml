name: Build Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - stable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Build Expo React Native bundle for Android
      run: npx expo export -p android --platform android --output-dir dist

    - name: Decode signing keystore (for signed release builds)
      if: env.HAS_KEYSTORE == 'true'
      env:
        HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || '' }}
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          mkdir -p $HOME/.android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $HOME/.android/app-release.jks
          echo "RELEASE_STORE_FILE=$HOME/.android/app-release.jks" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
          echo "Keystore decoded to $HOME/.android/app-release.jks"
        fi

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        ndk: 25.1.8140593
        build-tools: 34.0.0

    - name: Build Android debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Build signed Android release APK
      if: env.HAS_STORE_FILE == 'true'
      env:
        HAS_STORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || '' }}
      run: |
        cd android
        ./gradlew assembleRelease --stacktrace

    - name: Build unsigned Android release APK (fallback)
      if: env.HAS_STORE_FILE != 'true'
      run: |
        echo "No signing credentials configured; building unsigned release APK."
        cd android
        ./gradlew assembleRelease --stacktrace

    - name: Prepare output
      run: |
        mkdir -p build-output
        find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-output/ \;
        find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/ \;

    - name: Upload Debug APK artifact
      if: github.event_name != 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: opencode-mobile-debug-${{ github.sha }}
        path: build-output/app-debug.apk
        retention-days: 30

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: opencode-mobile-release-${{ github.sha }}
        path: build-output/app-release.apk
        retention-days: 30

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-build-${{ github.sha }}
        name: Android Build ${{ github.ref_name }}
        body: |
          ## 🚀 Android App Build
          ### Build Information
          - **Branch**: ${{ github.ref_name }}
          - **Commit SHA**: ${{ github.sha }}
          - **Build Number**: ${{ github.run_number }}
          - **Trigger**: ${{ github.event_name }}

          ### Files
          - `app-debug.apk` — Debug build (for testing)
          - `app-release.apk` — Release build (signed/unigned)
        draft: false
        prerelease: ${{ github.event.inputs.release_type != 'stable' }}
        files: |
          build-output/app-debug.apk
          build-output/app-release.apk
        generate_release_notes: true

    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::Android build failed! Check the GitHub Actions logs for details."